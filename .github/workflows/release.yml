name: Publish preview release
on:
  push:
    branches: [main]
    paths: [server/package.json, .github/workflows/release.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test server/password.test.mjs
      - run: node --check server/index.mjs && node --check server/account.mjs && npm run check && npm run build
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v0.5.0 >/dev/null 2>&1; then
            gh release create v0.5.0 --target "$GITHUB_SHA" --title "v0.5.0 管理員工作台與全站跑馬公告" --notes-file deploy/RELEASE.md
          fi
